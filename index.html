<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reef Camera - 3D Underwater View</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    
    <!-- UI Layer -->

      <!-- ユーザーが削除予定: カメラの現在地とフォーカス先を表示 -->
      <div id="cameraInfo" style="margin-top: 10px; background: rgba(0,0,0,0.5); color: white; padding: 10px; border-radius: 8px; font-size: 12px; font-family: monospace; white-space: pre-line;"></div>
    </div>
    
    <script type="module" src="/main.js"></script>
  </body>
